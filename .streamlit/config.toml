# The chart palette was validated against the light chart surface #fcfcfb.
# Pinning the theme keeps the surface the validator checked the same surface
# the app actually renders on.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f2f1ed"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
